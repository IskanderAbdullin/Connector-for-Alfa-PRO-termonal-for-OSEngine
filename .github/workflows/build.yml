name: Alfa PRO connector build
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/AlfaPro.Core.Tests/AlfaPro.Core.Tests.csproj --configuration Release

  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run isolated WebSocket broker simulator and scenarios
        run: dotnet run --project tests/AlfaPro.SimulatorTests/AlfaPro.SimulatorTests.csproj --configuration Release
      - name: Upload per-scenario simulator report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfapro-simulator-results
          path: test-results/simulator-results.json
          if-no-files-found: warn

  osengine-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch official OsEngine
        shell: pwsh
        run: git -c core.longpaths=true clone --depth 1 https://github.com/AlexWan/OsEngine.git C:/osengine
      - name: Inject connector into OsEngine
        shell: pwsh
        run: python tools/install_into_osengine.py --osengine C:/osengine/project/OsEngine
      - name: Build Windows OsEngine
        shell: pwsh
        run: dotnet build C:/osengine/project/OsEngine/OsEngine.csproj --configuration Debug
